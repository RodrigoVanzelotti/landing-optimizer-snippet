name: landing-optimizer-snippet

# Standard built bundles: docker compose up --build
# Live SDK/demo changes: docker compose -f docker-compose.yml -f docker-compose.watch.yml up --build --watch

services:
  sdk:
    build:
      context: .
    command: ['serve', 'dist', '-l', '4000']
    ports:
      - 4000:4000
    restart: unless-stopped

  demo:
    build:
      context: .
    command: ['serve', 'sites/generic_landing_page', '-l', '3005']
    ports:
      - 3005:3005
    depends_on:
      - sdk
    restart: unless-stopped