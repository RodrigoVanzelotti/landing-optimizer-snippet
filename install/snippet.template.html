<!--
  Landing Optimizer — install snippet (template)
  The dashboard generates a per-site copy with real values substituted for the
  {{PLACEHOLDERS}}. Paste this just before </head>. It loads asynchronously and
  never blocks rendering.
-->
<script>
  window.__LO_CONFIG = {
    siteId: "{{SITE_ID}}",
    ingestKey: "{{INGEST_KEY}}",
    publicKey: "{{PUBLIC_KEY}}",
    sdkUrl: "https://cdn.landingoptimizer.io/sdk/v{{SDK_VERSION}}/lo.js",
    ingestUrl: "https://ingest.landingoptimizer.io/v1/events",
    configUrl: "https://cdn.landingoptimizer.io/v1/config"
  };
  (function (w, d) {
    w.LandingOptimizer = w.LandingOptimizer || {
      q: [],
      track: function () { this.q.push(["track", [].slice.call(arguments)]); },
      conversion: function () { this.q.push(["conversion", [].slice.call(arguments)]); },
      identifyCompanyContext: function () { this.q.push(["identifyCompanyContext", [].slice.call(arguments)]); }
    };
    var c = w.__LO_CONFIG, s = d.createElement("script");
    s.async = true; s.src = c.sdkUrl; s.crossOrigin = "anonymous";
    s.setAttribute("data-site-id", c.siteId);
    s.setAttribute("data-ingest-key", c.ingestKey);
    s.setAttribute("data-public-key", c.publicKey);
    s.setAttribute("data-ingest-url", c.ingestUrl);
    s.setAttribute("data-config-url", c.configUrl);
    var f = d.getElementsByTagName("script")[0];
    if (f && f.parentNode) f.parentNode.insertBefore(s, f);
    else (d.head || d.documentElement).appendChild(s);
  })(window, document);
</script>
